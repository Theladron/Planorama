[pytest]
testpaths = app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html
markers =
    unit: Unit tests (fast, no database)
    integration: Integration tests (may use database)
    slow: Slow running tests
filterwarnings =
    ignore::DeprecationWarning:fastapi.*
    # Suppress FastAPI's deprecated asyncio.iscoroutinefunction warnings
    # These are from FastAPI's internal code, not our code, and will be fixed by FastAPI in a future version

