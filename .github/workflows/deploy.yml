name: Deploy to AWS

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering (bypasses CI check)

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    environment: Planorama  # Use GitHub Environment
    # Only deploy if CI workflow completed successfully (when triggered by workflow_run)
    # Manual triggers (workflow_dispatch) always run
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # When triggered by workflow_run, checkout the commit from the CI workflow
          # When triggered manually (workflow_dispatch), checkout normally
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Configure SSH
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          # Write SSH key - the secret should contain the entire .pem file content
          # Including -----BEGIN RSA PRIVATE KEY----- and -----END RSA PRIVATE KEY-----
          echo "${{ secrets.AWS_EC2_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          # Verify key file format
          if ! grep -q "BEGIN.*PRIVATE KEY" "$HOME/.ssh/deploy_key"; then
            echo "ERROR: SSH key does not contain BEGIN PRIVATE KEY marker"
            echo "First 2 lines of key file:"
            head -2 "$HOME/.ssh/deploy_key"
            exit 1
          fi
          ssh-keyscan -H ${{ vars.AWS_EC2_HOST }} >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          {
            echo "Host ${{ vars.AWS_EC2_HOST }}"
            echo "  ServerAliveInterval 30"
            echo "  ServerAliveCountMax 60"
            echo "  TCPKeepAlive yes"
            echo "  Compression yes"
            echo "  LogLevel ERROR"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          echo "SSH configuration completed"

      - name: Deploy to EC2
        env:
          # GitHub context (automatically available)
          GITHUB_REPOSITORY: ${{ github.repository }}
          # EC2 Connection (these should be in Environment Secrets, not Variables)
          EC2_HOST: ${{ vars.AWS_EC2_HOST }}
          EC2_USER: ${{ vars.AWS_EC2_USER }}
          EC2_APP_PATH: ${{ vars.AWS_EC2_APP_PATH }}
          # Database
          POSTGRESQL_USERNAME: ${{ vars.POSTGRESQL_USERNAME }}
          POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          POSTGRESQL_SERVER: ${{ vars.POSTGRESQL_SERVER }}
          POSTGRESQL_PORT: ${{ vars.POSTGRESQL_PORT }}
          POSTGRESQL_DATABASE: ${{ vars.POSTGRESQL_DATABASE }}
          # API Keys (these should be in Environment Secrets)
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          # Environment
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          DOMAIN: ${{ vars.DOMAIN }}
          BACKEND_CORS_ORIGINS: ${{ vars.BACKEND_CORS_ORIGINS }}
          DEBUG: ${{ vars.DEBUG }}
          # Admin User (ADMIN_PASSWORD should be in Environment Secrets)
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # Auth0 Configuration
          AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          AUTH0_MANAGEMENT_CLIENT_ID: ${{ secrets.AUTH0_MANAGEMENT_CLIENT_ID }}
          AUTH0_MANAGEMENT_CLIENT_SECRET: ${{ secrets.AUTH0_MANAGEMENT_CLIENT_SECRET }}
          AUTH0_CONNECTION_NAME: ${{ vars.AUTH0_CONNECTION_NAME }}
          # Frontend
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
        run: |
          APP_PATH="${EC2_APP_PATH:-/opt/planorama}"
          
          # Create .env file content locally with variable expansion
          cat > /tmp/.env << EOF
          # Backend Configuration
          ENVIRONMENT=${ENVIRONMENT}
          DEBUG=${DEBUG:-False}
          BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
          
          # PostgreSQL Database Configuration
          POSTGRESQL_USERNAME=${POSTGRESQL_USERNAME}
          POSTGRESQL_PASSWORD=${POSTGRESQL_PASSWORD}
          POSTGRESQL_SERVER=${POSTGRESQL_SERVER:-postgres}
          POSTGRESQL_PORT=${POSTGRESQL_PORT:-5432}
          POSTGRESQL_DATABASE=${POSTGRESQL_DATABASE}
          
          # Domain Configuration
          DOMAIN=${DOMAIN}
          
          # Frontend Configuration
          VITE_BACKEND_URL=${VITE_BACKEND_URL}
          
          # API Keys
          ORS_API_KEY=${ORS_API_KEY}
          AI_API_KEY=${AI_API_KEY}
          
          # Admin User Configuration (for seeding)
          ADMIN_EMAIL=${ADMIN_EMAIL}
          ADMIN_USERNAME=${ADMIN_USERNAME}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          
          # Auth0 Configuration
          AUTH0_DOMAIN=${AUTH0_DOMAIN}
          AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
          AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
          AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
          AUTH0_MANAGEMENT_CLIENT_ID=${AUTH0_MANAGEMENT_CLIENT_ID}
          AUTH0_MANAGEMENT_CLIENT_SECRET=${AUTH0_MANAGEMENT_CLIENT_SECRET}
          AUTH0_CONNECTION_NAME=${AUTH0_CONNECTION_NAME:-Username-Password-Authentication}
          EOF
          
          # Deploy code and .env file to EC2
          echo "Attempting SSH connection to ${EC2_USER}@${EC2_HOST}..."
          echo "Verifying SSH key format..."
          ssh-keygen -l -f "$HOME/.ssh/deploy_key" 2>&1 || echo "Key format check completed"
          
          # Deploy code and .env file to EC2
          # Using increased timeout (60s) but keeping simple structure that worked before
          ssh -T -i "$HOME/.ssh/deploy_key" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            -o ConnectTimeout=60 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ${EC2_USER}@${EC2_HOST} << ENDSSH
            set -e
            
            # Create app directory if it doesn't exist
            if [ ! -d "${APP_PATH}" ]; then
              echo "Creating app directory ${APP_PATH}..."
              mkdir -p ${APP_PATH}
            fi
            
            cd ${APP_PATH}
            
            # Add safe directory to avoid "dubious ownership" error
            git config --global --add safe.directory ${APP_PATH}
            
            # Clone repository if not already cloned, otherwise pull latest
            if [ ! -d ".git" ]; then
              echo "Repository not found. Cloning repository..."
              # Note: For private repos, ensure git credentials are configured on EC2
              # or clone manually once, then the workflow will handle updates
              git clone https://github.com/${GITHUB_REPOSITORY}.git .
            else
              echo "Pulling latest code..."
              git fetch origin
              git reset --hard origin/main
            fi
            
            echo "Code updated successfully"
          ENDSSH
          
          # Upload .env file to EC2 (after git reset to ensure it's not overwritten)
          echo "Uploading .env file to EC2..."
          scp -i "$HOME/.ssh/deploy_key" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            -o ConnectTimeout=60 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            /tmp/.env ${EC2_USER}@${EC2_HOST}:${APP_PATH}/.env
          
          # Clean up local temp file
          rm /tmp/.env
          
          echo ".env file uploaded successfully"
          
          # Continue with container deployment
          echo "Connecting to EC2 for container deployment..."
          ssh -T -i "$HOME/.ssh/deploy_key" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            -o ConnectTimeout=60 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ${EC2_USER}@${EC2_HOST} << ENDSSH
            set -e
            cd ${APP_PATH}
            
            echo "Verifying .env file exists..."
            if [ ! -f .env ]; then
              echo "ERROR: .env file not found!"
              exit 1
            fi
            echo ".env file verified"
            
            echo "Stopping containers..."
            docker compose down || true
            
            echo "Building containers (this may take several minutes)..."
            echo "Start time: $(date)"
            # Docker Compose uses Docker's layer caching automatically:
            # - Unchanged layers are reused from cache (very fast)
            # - Only changed layers are rebuilt
            # - This means if only frontend files changed, backend layers are reused and vice versa
            # Use --progress=plain to see build output and detect if it's stuck
            # Note: Large packages like SQLAlchemy may take 2-5 minutes to download
            # If timeout command is available, use it (30 minutes should be more than enough)
            if command -v timeout >/dev/null 2>&1; then
              if timeout 1800 docker compose build --progress=plain; then
                echo "Build completed successfully at: $(date)"
              else
                EXIT_CODE=$?
                echo "ERROR: Docker build failed or timed out (exit code: $EXIT_CODE)"
                echo "End time: $(date)"
                echo "Checking Docker status..."
                docker ps -a
                echo "Checking disk space..."
                df -h
                echo "Checking network connectivity..."
                ping -c 3 pypi.org || echo "Warning: Cannot reach PyPI"
                exit 1
              fi
            else
              # Fallback if timeout command is not available
              echo "Warning: timeout command not available, building without timeout"
              docker compose build --progress=plain
              echo "Build completed successfully at: $(date)"
            fi

            echo "Starting containers..."
            docker compose up -d
            
            echo "Waiting for services to start..."
            sleep 15
            
            echo "Checking container status..."
            docker compose ps
            
            echo "Checking container logs for errors..."
            echo "=== Backend logs (last 50 lines) ==="
            docker compose logs --tail=50 backend || true
            echo "=== Frontend logs (last 50 lines) ==="
            docker compose logs --tail=50 frontend || true
            
            echo "Verifying containers are running..."
            if ! docker compose ps | grep -q "planorama_backend.*Up"; then
              echo "ERROR: Backend container is not running!"
              docker compose logs backend
              exit 1
            fi
            if ! docker compose ps | grep -q "planorama_frontend.*Up"; then
              echo "ERROR: Frontend container is not running!"
              docker compose logs frontend
              exit 1
            fi
            
            echo "Deployment completed successfully"
          ENDSSH

