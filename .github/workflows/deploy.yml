name: Deploy to AWS

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering (bypasses CI check)

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    environment: Planorama  # Use GitHub Environment
    # Only deploy if CI workflow completed successfully (when triggered by workflow_run)
    # Manual triggers (workflow_dispatch) always run
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # When triggered by workflow_run, checkout the commit from the CI workflow
          # When triggered manually (workflow_dispatch), checkout normally
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Configure SSH
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          # Write SSH key - the secret should contain the entire .pem file content
          # Including -----BEGIN RSA PRIVATE KEY----- and -----END RSA PRIVATE KEY-----
          echo "${{ secrets.AWS_EC2_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          # Verify key file format
          if ! grep -q "BEGIN.*PRIVATE KEY" "$HOME/.ssh/deploy_key"; then
            echo "ERROR: SSH key does not contain BEGIN PRIVATE KEY marker"
            echo "First 2 lines of key file:"
            head -2 "$HOME/.ssh/deploy_key"
            exit 1
          fi
          ssh-keyscan -H ${{ vars.AWS_EC2_HOST }} >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          {
            echo "Host ${{ vars.AWS_EC2_HOST }}"
            echo "  ServerAliveInterval 30"
            echo "  ServerAliveCountMax 60"
            echo "  TCPKeepAlive yes"
            echo "  Compression yes"
            echo "  LogLevel ERROR"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          echo "SSH configuration completed"

      - name: Deploy to EC2
        env:
          # GitHub context (automatically available)
          GITHUB_REPOSITORY: ${{ github.repository }}
          # EC2 Connection (these should be in Environment Secrets, not Variables)
          EC2_HOST: ${{ vars.AWS_EC2_HOST }}
          EC2_USER: ${{ vars.AWS_EC2_USER }}
          EC2_APP_PATH: ${{ vars.AWS_EC2_APP_PATH }}
          # Database
          POSTGRESQL_USERNAME: ${{ vars.POSTGRESQL_USERNAME }}
          POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          POSTGRESQL_SERVER: ${{ vars.POSTGRESQL_SERVER }}
          POSTGRESQL_PORT: ${{ vars.POSTGRESQL_PORT }}
          POSTGRESQL_DATABASE: ${{ vars.POSTGRESQL_DATABASE }}
          # API Keys (these should be in Environment Secrets)
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          # Environment
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          DOMAIN: ${{ vars.DOMAIN }}
          BACKEND_CORS_ORIGINS: ${{ vars.BACKEND_CORS_ORIGINS }}
          DEBUG: ${{ vars.DEBUG }}
          # Admin User (ADMIN_PASSWORD should be in Environment Secrets)
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # Auth0 Configuration
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          AUTH0_MANAGEMENT_CLIENT_ID: ${{ secrets.AUTH0_MANAGEMENT_CLIENT_ID }}
          AUTH0_MANAGEMENT_CLIENT_SECRET: ${{ secrets.AUTH0_MANAGEMENT_CLIENT_SECRET }}
          # AUTH0_CONNECTION_NAME is hard-coded to the default Auth0 database connection
          # Only used for backend Management API operations (e.g., seeding admin user)
          # Frontend authentication doesn't use this - Auth0 handles connection selection automatically
          AUTH0_CONNECTION_NAME: "Username-Password-Authentication"
          # Frontend
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
        run: |
          APP_PATH="${EC2_APP_PATH:-/opt/planorama}"
          
          # Verify critical environment variables are set
          echo "Verifying environment variables are set..."
          if [ -z "${AUTH0_DOMAIN}" ]; then
            echo "ERROR: AUTH0_DOMAIN is not set in GitHub Actions environment!"
            echo "Please ensure AUTH0_DOMAIN is set in GitHub Environment Secrets for the 'Planorama' environment"
            exit 1
          fi
          if [ -z "${AUTH0_AUDIENCE}" ]; then
            echo "ERROR: AUTH0_AUDIENCE is not set in GitHub Actions environment!"
            exit 1
          fi
          if [ -z "${AUTH0_CLIENT_ID}" ]; then
            echo "ERROR: AUTH0_CLIENT_ID is not set in GitHub Actions environment!"
            exit 1
          fi
          echo "Environment variables verified (showing non-sensitive keys only):"
          echo "AUTH0_DOMAIN=${AUTH0_DOMAIN:0:10}... (set)"
          echo "AUTH0_AUDIENCE=${AUTH0_AUDIENCE:0:10}... (set)"
          echo "AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID:0:10}... (set)"
          
          # Create .env file content locally with variable expansion
          cat > /tmp/.env << EOF
          # Backend Configuration
          ENVIRONMENT=${ENVIRONMENT}
          DEBUG=${DEBUG:-False}
          BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
          
          # PostgreSQL Database Configuration
          POSTGRESQL_USERNAME=${POSTGRESQL_USERNAME}
          POSTGRESQL_PASSWORD=${POSTGRESQL_PASSWORD}
          POSTGRESQL_SERVER=${POSTGRESQL_SERVER:-postgres}
          POSTGRESQL_PORT=${POSTGRESQL_PORT:-5432}
          POSTGRESQL_DATABASE=${POSTGRESQL_DATABASE}
          
          # Domain Configuration
          DOMAIN=${DOMAIN}
          
          # Frontend Configuration
          VITE_BACKEND_URL=${VITE_BACKEND_URL}
          
          # API Keys
          ORS_API_KEY=${ORS_API_KEY}
          AI_API_KEY=${AI_API_KEY}
          
          # Admin User Configuration (for seeding)
          ADMIN_EMAIL=${ADMIN_EMAIL}
          ADMIN_USERNAME=${ADMIN_USERNAME}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          
          # Auth0 Configuration
          AUTH0_DOMAIN=${AUTH0_DOMAIN}
          AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
          AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
          AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
          AUTH0_MANAGEMENT_CLIENT_ID=${AUTH0_MANAGEMENT_CLIENT_ID}
          AUTH0_MANAGEMENT_CLIENT_SECRET=${AUTH0_MANAGEMENT_CLIENT_SECRET}
          AUTH0_CONNECTION_NAME=Username-Password-Authentication
          EOF
          
          # Deploy code and .env file to EC2
          echo "Attempting SSH connection to ${EC2_USER}@${EC2_HOST}..."
          echo "Verifying SSH key format..."
          ssh-keygen -l -f "$HOME/.ssh/deploy_key" 2>&1 || echo "Key format check completed"
          
          # Deploy code and .env file to EC2
          # Using increased timeout (60s) but keeping simple structure that worked before
          ssh -T -i "$HOME/.ssh/deploy_key" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            -o ConnectTimeout=60 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ${EC2_USER}@${EC2_HOST} << ENDSSH
            set -e
            
            # Create app directory if it doesn't exist
            if [ ! -d "${APP_PATH}" ]; then
              echo "Creating app directory ${APP_PATH}..."
              mkdir -p ${APP_PATH}
            fi
            
            cd ${APP_PATH}
            
            # Add safe directory to avoid "dubious ownership" error
            git config --global --add safe.directory ${APP_PATH}
            
            # Clone repository if not already cloned, otherwise pull latest
            if [ ! -d ".git" ]; then
              echo "Repository not found. Cloning repository..."
              # Note: For private repos, ensure git credentials are configured on EC2
              # or clone manually once, then the workflow will handle updates
              git clone https://github.com/${GITHUB_REPOSITORY}.git .
            else
              echo "Pulling latest code..."
              git fetch origin
              git reset --hard origin/main
            fi
            
            echo "Code updated successfully"
          ENDSSH
          
          # Upload .env file to EC2 (after git reset to ensure it's not overwritten)
          echo "Uploading .env file to EC2..."
          scp -i "$HOME/.ssh/deploy_key" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            -o ConnectTimeout=60 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            /tmp/.env ${EC2_USER}@${EC2_HOST}:${APP_PATH}/.env
          
          # Clean up local temp file
          rm /tmp/.env
          
          echo ".env file uploaded successfully"
          
          # Continue with container deployment
          echo "Connecting to EC2 for container deployment..."
          ssh -T -i "$HOME/.ssh/deploy_key" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            -o ConnectTimeout=60 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ${EC2_USER}@${EC2_HOST} << ENDSSH
            set -e
            cd ${APP_PATH}
            
            echo "Verifying .env file exists..."
            if [ ! -f .env ]; then
              echo "ERROR: .env file not found!"
              exit 1
            fi
            echo ".env file verified"
            
            echo "Checking critical environment variables in .env file..."
            # Check that critical variables are not empty (without exposing secrets)
            if ! grep -q "^AUTH0_DOMAIN=.*[^[:space:]]" .env; then
              echo "ERROR: AUTH0_DOMAIN is missing or empty in .env file!"
              echo "First 20 lines of .env (masking secrets):"
              sed 's/=.*/=***MASKED***/' .env | head -20
              exit 1
            fi
            if ! grep -q "^AUTH0_AUDIENCE=.*[^[:space:]]" .env; then
              echo "ERROR: AUTH0_AUDIENCE is missing or empty in .env file!"
              exit 1
            fi
            if ! grep -q "^AUTH0_CLIENT_ID=.*[^[:space:]]" .env; then
              echo "ERROR: AUTH0_CLIENT_ID is missing or empty in .env file!"
              exit 1
            fi
            echo "Critical environment variables verified (showing non-sensitive keys only):"
            grep -E "^(AUTH0_DOMAIN|AUTH0_AUDIENCE|ENVIRONMENT|DOMAIN|POSTGRESQL_DATABASE)=" .env | sed 's/=.*/=***MASKED***/'
            
            echo "Stopping containers..."
            docker compose down || true
            
            echo "Cleaning up Docker to free disk space..."
            echo "Disk space before cleanup:"
            df -h /
            
            # Stop all containers first
            docker stop $(docker ps -aq) 2>/dev/null || true
            docker rm $(docker ps -aq) 2>/dev/null || true
            
            # Remove ALL images except the ones we're about to build (very aggressive)
            # Keep only postgres and nginx base images if they exist
            docker images --format "{{.ID}} {{.Repository}}" | grep -v "postgres\|nginx\|node\|python" | awk '{print $1}' | xargs -r docker rmi -f 2>/dev/null || true
            
            # Remove all unused containers, networks, images, build cache
            docker system prune -af --volumes || true
            
            # Aggressively remove build cache
            docker builder prune -af || true
            
            # Remove all unused images
            docker image prune -af || true
            
            # Clean up Docker's internal storage
            docker system df
            echo "Disk space after cleanup:"
            df -h /
            
            # Check available space
            AVAILABLE_SPACE=$(df / | tail -1 | awk '{print $4}')
            echo "Available space: ${AVAILABLE_SPACE}KB"
            
            if [ "$AVAILABLE_SPACE" -lt 1048576 ]; then
              echo "WARNING: Less than 1GB free space. Attempting additional cleanup..."
              # Remove ALL images (we'll rebuild them)
              docker rmi $(docker images -q) 2>/dev/null || true
              docker system prune -af --volumes || true
              echo "Disk space after aggressive cleanup:"
              df -h /
            fi
            
            echo "Building containers (this may take several minutes)..."
            echo "Start time: $(date)"
            # Build only backend and frontend - skip test service to save space
            # Build services one at a time to free space between builds
            
            echo "Building backend..."
            if command -v timeout >/dev/null 2>&1; then
              timeout 900 docker compose build --progress=plain backend || {
                echo "Backend build failed, cleaning up and retrying..."
                docker builder prune -af || true
                timeout 900 docker compose build --progress=plain backend || exit 1
              }
            else
              docker compose build --progress=plain backend || exit 1
            fi
            
            # Clean up build cache after backend to free space for frontend
            echo "Cleaning build cache after backend build..."
            docker builder prune -af || true
            echo "Disk space after backend build:"
            df -h /
            
            echo "Building frontend..."
            if command -v timeout >/dev/null 2>&1; then
              timeout 900 docker compose build --progress=plain frontend || {
                echo "Frontend build failed, cleaning up and retrying..."
                docker builder prune -af || true
                timeout 900 docker compose build --progress=plain frontend || exit 1
              }
            else
              docker compose build --progress=plain frontend || exit 1
            fi
            
            echo "Build completed successfully at: $(date)"
            echo "Final disk space:"
            df -h /

            echo "Starting containers..."
            docker compose up -d
            
            echo "Waiting for services to start..."
            sleep 15
            
            echo "Checking container status..."
            docker compose ps
            
            echo "Checking container logs for errors..."
            echo "=== Backend logs (last 50 lines) ==="
            docker compose logs --tail=50 backend || true
            echo "=== Frontend logs (last 50 lines) ==="
            docker compose logs --tail=50 frontend || true
            
            echo "Verifying containers are running..."
            if ! docker compose ps | grep -q "planorama_backend.*Up"; then
              echo "ERROR: Backend container is not running!"
              docker compose logs backend
              exit 1
            fi
            if ! docker compose ps | grep -q "planorama_frontend.*Up"; then
              echo "ERROR: Frontend container is not running!"
              docker compose logs frontend
              exit 1
            fi
            
            echo "Deployment completed successfully"
          ENDSSH

