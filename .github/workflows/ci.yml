name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Skip CI on merge commits (when PRs are merged, they create a push event with a merge commit)
# This prevents duplicate runs: we check PRs, then skip the redundant check on merge
jobs:
  # Skip job if this is a merge commit from a PR
  check:
    name: Check if should run CI
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Fetch enough commits to check if it's a merge
      
      - name: Check if merge commit
        id: check
        run: |
          # For pull_request events, always run (skip this check)
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "Pull request event, running CI"
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # For push events, check if this is a merge commit
          # Check if this is a merge commit (has multiple parents) or merge commit message
          if git show --no-patch --format=%P HEAD | grep -q " "; then
            echo "This is a merge commit (multiple parents), skipping CI (already checked in PR)"
            echo "should_run=false" >> $GITHUB_OUTPUT
          elif git log -1 --pretty=%B HEAD | grep -qE "^Merge (pull request|branch)"; then
            echo "This is a merge commit (merge message detected), skipping CI (already checked in PR)"
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "This is a regular commit, running CI"
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  backend-tests:
    needs: check
    if: needs.check.outputs.should_run == 'true' || github.event_name == 'pull_request'
    name: Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          # Required environment variables for pytest
          POSTGRESQL_USERNAME: postgres
          POSTGRESQL_PASSWORD: postgres
          POSTGRESQL_SERVER: localhost
          POSTGRESQL_PORT: 5432
          POSTGRESQL_DATABASE: test_planorama
          ORS_API_KEY: test-ors-api-key
          AI_API_KEY: test-ai-api-key
          DOMAIN: localhost:8000
          ENVIRONMENT: local
          DEBUG: False
          # Auth0 test variables (dummy values for CI)
          AUTH0_DOMAIN: test-auth0-domain
          AUTH0_AUDIENCE: https://test-api.planorama
          AUTH0_CLIENT_ID: test-client-id
          AUTH0_CLIENT_SECRET: test-client-secret
          AUTH0_MANAGEMENT_CLIENT_ID: test-mgmt-client-id
          AUTH0_MANAGEMENT_CLIENT_SECRET: test-mgmt-client-secret
          AUTH0_CONNECTION_NAME: Username-Password-Authentication
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov (optional)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  backend-lint:
    name: Backend Lint (Pylint)
    needs: check
    if: needs.check.outputs.should_run == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pylint
        run: |
          pylint app --rcfile=.pylintrc --exit-zero --score=yes > pylint_output.txt 2>&1 || true
          cat pylint_output.txt
          
      - name: Check pylint score
        run: |
          python3 << 'EOF'
          import re
          import sys
          with open('pylint_output.txt', 'r') as f:
              output = f.read()
          match = re.search(r'rated at ([\d.]+)/10', output)
          if match:
              score = float(match.group(1))
              print(f"Pylint score: {score}/10")
              if score < 8.0:
                  print(f"ERROR: Pylint score {score} is below 8.0")
                  sys.exit(1)
          else:
              print("Warning: Could not parse pylint score")
              sys.exit(0)
          EOF

  frontend-tests:
    name: Frontend Tests
    needs: check
    if: needs.check.outputs.should_run == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/react/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend/react
        run: npm ci

      - name: Run tests
        working-directory: ./frontend/react
        run: npm test -- --coverage --watchAll=false

  frontend-lint:
    name: Frontend Lint (ESLint)
    needs: check
    if: needs.check.outputs.should_run == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/react/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend/react
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend/react
        run: npm run lint

