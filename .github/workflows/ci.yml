name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov (optional)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  backend-lint:
    name: Backend Lint (Pylint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pylint
        run: |
          pylint app --rcfile=.pylintrc --exit-zero --score=yes > pylint_output.txt 2>&1 || true
          cat pylint_output.txt
          
      - name: Check pylint score
        run: |
          python3 << 'EOF'
          import re
          import sys
          with open('pylint_output.txt', 'r') as f:
              output = f.read()
          match = re.search(r'rated at ([\d.]+)/10', output)
          if match:
              score = float(match.group(1))
              print(f"Pylint score: {score}/10")
              if score < 8.0:
                  print(f"ERROR: Pylint score {score} is below 8.0")
                  sys.exit(1)
          else:
              print("Warning: Could not parse pylint score")
              sys.exit(0)
          EOF

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/react/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend/react
        run: npm ci

      - name: Run tests
        working-directory: ./frontend/react
        run: npm test -- --coverage --watchAll=false

  frontend-lint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/react/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend/react
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend/react
        run: npm run lint

